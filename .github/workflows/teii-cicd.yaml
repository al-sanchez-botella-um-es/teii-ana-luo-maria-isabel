name: CICD

# Controls when the action will run
on:
  push: # Se activa cuando mergeas una rama a otra dentro de main.
    branches: [ main ] 
  pull_request: # Se activa cuando haces un pullrequest a main
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "test-job"
  test-job:
    runs-on: ${{ matrix.os }}
    
    # The type of runner that the job will run on
    strategy:
      matrix:
        sistema: [ubuntu-22.04, ubuntu-24.04]  # Cambiado "os" por "sistema"
        version_python: ["3.11", "3.12", "3.13"]
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: Checkout repository
      uses: actions/checkout@v4

    # Sets up python version
    - name: Set up Python ${{ matrix.version_python }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.version_python }}
        cache: 'pip'

    # Executes python3
    - name: Runs python3
      run: |
        python3 --version
    
    - name: Instalar testing herramientas necesarias
      run: |
        python -m pip install --upgrade pip
        pip install tox virtualenv

    # Testear
    - name: Testear tests via Tox
      run: |
        if [ "${{ matrix.python-version }}" = "3.11" ]; then
          tox -e lint,py311
        elif [ "${{ matrix.python-version }}" = "3.12" ]; then
          tox -e lint,py312
        elif [ "${{ matrix.python-version }}" = "3.13" ]; then
          tox -e lint,py313
        fi
